[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-rl-bot"
version = "1.0.0"
description = "A finite-shoe Blackjack environment for comparing reinforcement learning agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["cards", "evaluate_agents", "game", "main"]

[tool.setuptools.packages.find]
include = ["agents*", "config*"]
namespaces = true
